name: E2E PgBouncer test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PREFECT_SERVER_DATABASE_CONNECTION_URL: "postgresql+asyncpg://prefect:prefect@localhost:6432/prefect"
  PREFECT_SERVER_DATABASE_SQLALCHEMY_POOL_SIZE: "null"
  PREFECT_SERVER_DATABASE_SQLALCHEMY_CONNECT_ARGS_STATEMENT_CACHE_SIZE: "0"
  PREFECT_API_URL: "http://localhost:4200/api"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres + PgBouncer
        run: docker compose up -d --wait

      - uses: astral-sh/setup-uv@v6

      - name: Create venv and install prefect from PR branch
        run: |
          uv venv .venv
          uv pip install -p .venv "prefect[server] @ git+https://github.com/PrefectHQ/prefect.git@support-pgbouncer-nullpool"
          uv pip install -p .venv httpx

      - name: Start Prefect server (PgBouncer, NullPool)
        run: |
          .venv/bin/prefect server start --host 0.0.0.0 &
          sleep 5

      - name: Run E2E test
        run: .venv/bin/python test_flow.py

      - name: Show PgBouncer stats
        if: always()
        run: |
          docker compose exec -T pgbouncer psql -p 6432 -U prefect pgbouncer -c "SHOW POOLS;" || true
          docker compose exec -T pgbouncer psql -p 6432 -U prefect pgbouncer -c "SHOW STATS;" || true

      - name: Cleanup
        if: always()
        run: docker compose down -v
